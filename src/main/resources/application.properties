# ============================================================
# Database
# ============================================================

# File-based H2 database used by the demo
spring.datasource.url=jdbc:h2:./data/dataquerydb

# H2 JDBC driver
spring.datasource.driver-class-name=org.h2.Driver

# Demo database user
spring.datasource.username=sa

# Demo database password
spring.datasource.password=

# Expose the H2 console for local inspection
spring.h2.console.enabled=true

# Run the idempotent sample data script on every startup
spring.sql.init.mode=always

# Create and update the AppJar schema automatically
spring.jpa.hibernate.ddl-auto=update

# Keep persistence work inside the service layer
spring.jpa.open-in-view=false

# Disable SQL logging in the demo output
spring.jpa.show-sql=false

# Format SQL when logging is enabled locally
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# Data Query routes
# ============================================================

# Query definition list route
com.appjars.dataquery.url.admin.queries=data-query/admin/queries

# Query definition creation route
com.appjars.dataquery.url.admin.queries-create=data-query/admin/queries/create

# Query definition editing route
com.appjars.dataquery.url.admin.queries-edit=data-query/admin/queries/edit

# Query category list route
com.appjars.dataquery.url.admin.categories=data-query/admin/categories

# Query report base route
com.appjars.dataquery.url.report=data-query/report

# Report designer base route
com.appjars.dataquery.url.report-designer=data-query/report-designer

# Dashboard list route
com.appjars.dataquery.url.admin.dashboards=data-query/admin/dashboards

# Dashboard creation route
com.appjars.dataquery.url.admin.dashboards-create=data-query/admin/dashboards/create

# Dashboard editing route
com.appjars.dataquery.url.admin.dashboards-edit=data-query/admin/dashboards/edit

# Read-only dashboard base route
com.appjars.dataquery.url.dashboard=data-query/dashboards

# ============================================================
# HQL connector
# ============================================================

# JPA entity names available to the seeded HQL query
com.appjars.dataquery.hql.allowed-entities=DemoEmployeeEntity

# ============================================================
# REST API connector
# ============================================================

# Hosts the seeded REST API query may call
com.appjars.dataquery.rest.allowed-hosts=jsonplaceholder.typicode.com

# Maximum rows accepted from a REST API response
com.appjars.dataquery.rest.max-rows=10000

# REST API connection timeout
com.appjars.dataquery.rest.connect-timeout=5s

# REST API read timeout
com.appjars.dataquery.rest.read-timeout=30s

# Maximum REST API response size in bytes
com.appjars.dataquery.rest.max-response-bytes=8388608

# ============================================================
# Internationalization
# ============================================================

# Locales included in this demo
com.appjars.utils.i8n.supportedLocales=en,es

# Locale used when a translation is unavailable
appjars.translations.default-locale=en

# ============================================================
# Vaadin
# ============================================================

# Do not open a browser automatically during startup
vaadin.launch-browser=false

# Packages Vaadin scans for components and routes
vaadin.allowed-packages=com.vaadin,org.vaadin,com.flowingcode,com.appjars,com.github.appreciated
