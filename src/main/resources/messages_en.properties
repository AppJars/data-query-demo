# Home (landing page)
appjars.dataquery.demo.home.title=Data Query Demo
appjars.dataquery.demo.home.hero.title=Data Query
appjars.dataquery.demo.home.hero.tagline=Ready-to-use, database-driven reporting for Vaadin and Spring Boot applications: stored queries over SQL, HQL or REST APIs, executed in auto-generated views with charts, drill-down, PDF reports and dashboards. This demo lets you try every feature before adding the AppJar to your project.
appjars.dataquery.demo.home.features.title=What''s inside
appjars.dataquery.demo.home.features.querycatalog.title=Query catalog
appjars.dataquery.demo.home.features.querycatalog.desc=Store queries with typed parameters, result columns and categories, and manage them from a searchable administration view.
appjars.dataquery.demo.home.features.connectors.title=Three connectors
appjars.dataquery.demo.home.features.connectors.desc=Run queries against your database with SQL or HQL, or against external services with the REST API connector, and plug in your own through the connector SPI.
appjars.dataquery.demo.home.features.charts.title=Charts
appjars.dataquery.demo.home.features.charts.desc=Visualize results as bar, line, area, pie, donut or scatter charts, with a one-click toggle back to the data grid.
appjars.dataquery.demo.home.features.drilldown.title=Drill-down navigation
appjars.dataquery.demo.home.features.drilldown.desc=Chart points and link columns are clickable: they carry the selected values into a target query or an external URL.
appjars.dataquery.demo.home.features.chaining.title=Query chaining
appjars.dataquery.demo.home.features.chaining.desc=Chain queries through temporary tables with dependencies, parameter mappings and value generators, ideal for staging external data.
appjars.dataquery.demo.home.features.reports.title=Reports and export
appjars.dataquery.demo.home.features.reports.desc=Design pixel-perfect PDF reports in the WYSIWYG report designer, or export any result grid to CSV, XLSX or PDF.
appjars.dataquery.demo.home.features.dashboards.title=Dashboards
appjars.dataquery.demo.home.features.dashboards.desc=Arrange query widgets by dragging and resizing, and share the result as a read-only dashboard with its own URL.
appjars.dataquery.demo.home.features.i18n.title=Internationalized texts
appjars.dataquery.demo.home.features.i18n.desc=Query, category and dashboard texts can be stored as translation keys, so the same content renders in each user''s language.
appjars.dataquery.demo.home.tryit.title=Try it now
appjars.dataquery.demo.home.tryit.intro=No login needed. The demo database is pre-seeded with sample sales data, five queries over three connectors, charts with drill-down links, a designed PDF report and a dashboard. Jump right in:
appjars.dataquery.demo.home.tryit.queries=Query Definitions
appjars.dataquery.demo.home.tryit.report=Sales by Region report
appjars.dataquery.demo.home.tryit.dashboard=Sales Overview dashboard
appjars.dataquery.demo.home.tour.button=Guided tour
appjars.dataquery.demo.home.tour.queries=Query Definitions view
appjars.dataquery.demo.home.tour.queryform=Query Definition editor
appjars.dataquery.demo.home.tour.categories=Query Categories view
appjars.dataquery.demo.home.tour.report=Report view
appjars.dataquery.demo.home.tour.designer=Report Designer view
appjars.dataquery.demo.home.tour.dashboards=Dashboards view
appjars.dataquery.demo.home.tour.dashboardform=Dashboard editor
appjars.dataquery.demo.home.tour.dashboard=Dashboard view
appjars.dataquery.demo.home.license.title=Free vs. full license
appjars.dataquery.demo.home.license.desc=This demo runs in free mode: every feature is fully functional, limited to 5 queries a user can open and 1 dashboard. Queries that store their results in a temporary table don''t count towards the limit. A full license removes the limits; nothing else changes.
appjars.dataquery.demo.home.license.link=Get a license at appjars.com
appjars.dataquery.demo.home.links.title=Learn more
appjars.dataquery.demo.home.links.github=AppJars on GitHub
appjars.dataquery.demo.home.links.readme=Data Query documentation

# Guided tours
appjars.dataquery.demo.tour.btn.next=Next
appjars.dataquery.demo.tour.btn.back=Back
appjars.dataquery.demo.tour.btn.done=Done
appjars.dataquery.demo.tour.queries.intro.title=Query Definitions view
appjars.dataquery.demo.tour.queries.intro.desc=A short tour of the query catalog, where stored queries are managed. Use Next to walk through it. You can close the tour at any time and reopen it from the Guided tour menu.
appjars.dataquery.demo.tour.queries.grid.title=The query catalog
appjars.dataquery.demo.tour.queries.grid.desc=Every stored query with its key, name, category, connector type and status. The menu of each row offers Execute, Design report, Edit, Enable/Disable and Delete.
appjars.dataquery.demo.tour.queries.filters.title=Filters
appjars.dataquery.demo.tour.queries.filters.desc=Filter the catalog by key, name, category, connector type or status. On small screens the filters move into a dialog.
appjars.dataquery.demo.tour.queries.create.title=Create queries
appjars.dataquery.demo.tour.queries.create.desc=Opens the query editor: six tabs covering the query body (SQL, HQL or REST), parameters, result columns, dependencies, chart visualization and the PDF report.
appjars.dataquery.demo.tour.queries.limits.title=Free mode limits
appjars.dataquery.demo.tour.queries.limits.desc=These badges track the free-mode quota: up to 5 queries a user can open and 1 dashboard. A full license removes the limits.
appjars.dataquery.demo.tour.queries.finish.title=That''s it!
appjars.dataquery.demo.tour.queries.finish.desc=Tip: edit the seeded Sales by Region query to see how its chart and drill-down are configured, or execute it right from the row menu.
appjars.dataquery.demo.tour.queryform.intro.title=Query Definition editor
appjars.dataquery.demo.tour.queryform.intro.desc=Create a stored query and configure how it runs and displays its results.
appjars.dataquery.demo.tour.queryform.tabs.title=Definition sections
appjars.dataquery.demo.tour.queryform.tabs.desc=The tabs cover general settings, parameters, result columns, dependencies, visualization and report design.
appjars.dataquery.demo.tour.queryform.connector.title=Connector type
appjars.dataquery.demo.tour.queryform.connector.desc=Choose SQL, HQL or REST API. The query editor adapts to the selected connector.
appjars.dataquery.demo.tour.queryform.save.title=Save the query
appjars.dataquery.demo.tour.queryform.save.desc=Save the definition after the required fields and result columns are configured.
appjars.dataquery.demo.tour.queryform.finish.title=That''s it!
appjars.dataquery.demo.tour.queryform.finish.desc=Open the seeded definitions to compare complete SQL, HQL and REST API examples.
appjars.dataquery.demo.tour.categories.intro.title=Query Categories view
appjars.dataquery.demo.tour.categories.intro.desc=Categories organize stored queries and control how they are grouped for users.
appjars.dataquery.demo.tour.categories.grid.title=Category catalog
appjars.dataquery.demo.tour.categories.grid.desc=Search categories by key or display name and use each row menu to edit or delete them.
appjars.dataquery.demo.tour.categories.create.title=New category
appjars.dataquery.demo.tour.categories.create.desc=Create a category with a display name, description, icon and display order.
appjars.dataquery.demo.tour.categories.finish.title=That''s it!
appjars.dataquery.demo.tour.categories.finish.desc=The seeded Sales Reports, HR Reports and Operations categories cover the showcase queries.
appjars.dataquery.demo.tour.report.intro.title=Report view
appjars.dataquery.demo.tour.report.intro.desc=A short tour of the auto-generated execution view, on the seeded Sales by Region query. Use Next to walk through it. You can reopen it from the Guided tour menu.
appjars.dataquery.demo.tour.report.parameters.title=Parameters
appjars.dataquery.demo.tour.report.parameters.desc=This form is generated from the query''s parameter definitions, including types, defaults and value generators. Here the end date comes pre-filled by a value generator.
appjars.dataquery.demo.tour.report.execute.title=Execute
appjars.dataquery.demo.tour.report.execute.desc=Runs the query with the parameters above. Results load lazily, with server-side sorting and per-column filters.
appjars.dataquery.demo.tour.report.results.title=Chart or grid
appjars.dataquery.demo.tour.report.results.desc=Sales by Region renders as a bar chart; the toggle button switches to the data grid, where the results can be exported to CSV, XLSX or PDF.
appjars.dataquery.demo.tour.report.drilldown.title=Drill-down
appjars.dataquery.demo.tour.report.drilldown.desc=After executing, click a bar of the chart: the region is carried into the Region Order Details query, which opens with its parameters pre-filled.
appjars.dataquery.demo.tour.report.finish.title=That''s it!
appjars.dataquery.demo.tour.report.finish.desc=Tip: every enabled query gets a view like this one. The form, grid, chart and exports are generated from the query definition.
appjars.dataquery.demo.tour.designer.intro.title=Report Designer view
appjars.dataquery.demo.tour.designer.intro.desc=Design the PDF exported by the seeded Sales by Region query.
appjars.dataquery.demo.tour.designer.canvas.title=Report canvas
appjars.dataquery.demo.tour.designer.canvas.desc=Arrange fields, labels, groups and page sections on the visual canvas.
appjars.dataquery.demo.tour.designer.save.title=Save the report
appjars.dataquery.demo.tour.designer.save.desc=Validate and save the design so report exports use the template.
appjars.dataquery.demo.tour.designer.finish.title=That''s it!
appjars.dataquery.demo.tour.designer.finish.desc=Run Sales by Region and export PDF to see the saved design with real query results.
appjars.dataquery.demo.tour.dashboards.intro.title=Dashboards view
appjars.dataquery.demo.tour.dashboards.intro.desc=Manage dashboard definitions and open their read-only runtime views.
appjars.dataquery.demo.tour.dashboards.grid.title=Dashboard catalog
appjars.dataquery.demo.tour.dashboards.grid.desc=Search dashboards and use each row menu to open, edit, enable, disable or delete one.
appjars.dataquery.demo.tour.dashboards.create.title=New dashboard
appjars.dataquery.demo.tour.dashboards.create.desc=Create a dashboard and arrange query widgets on its grid.
appjars.dataquery.demo.tour.dashboards.finish.title=That''s it!
appjars.dataquery.demo.tour.dashboards.finish.desc=Open the seeded Sales Overview dashboard to see chart and table widgets together.
appjars.dataquery.demo.tour.dashboardform.intro.title=Dashboard editor
appjars.dataquery.demo.tour.dashboardform.intro.desc=Define a dashboard and arrange the queries it presents as widgets.
appjars.dataquery.demo.tour.dashboardform.details.title=Dashboard details
appjars.dataquery.demo.tour.dashboardform.details.desc=Set the key, title, URL slug, description and grid size.
appjars.dataquery.demo.tour.dashboardform.widgets.title=Add widgets
appjars.dataquery.demo.tour.dashboardform.widgets.desc=Choose a stored query, display mode and parameter values for each widget.
appjars.dataquery.demo.tour.dashboardform.layout.title=Dashboard layout
appjars.dataquery.demo.tour.dashboardform.layout.desc=Drag and resize widgets on the grid to create the saved layout.
appjars.dataquery.demo.tour.dashboardform.save.title=Save the dashboard
appjars.dataquery.demo.tour.dashboardform.save.desc=Save the definition before opening its read-only runtime URL.
appjars.dataquery.demo.tour.dashboardform.finish.title=That''s it!
appjars.dataquery.demo.tour.dashboardform.finish.desc=The free license includes one dashboard, already represented by Sales Overview in this demo.
appjars.dataquery.demo.tour.dashboard.intro.title=Dashboard view
appjars.dataquery.demo.tour.dashboard.intro.desc=A short tour of the dashboard runtime, on the seeded Sales Overview dashboard. Use Next to walk through it. You can reopen it from the Guided tour menu.
appjars.dataquery.demo.tour.dashboard.title.title=A shareable page
appjars.dataquery.demo.tour.dashboard.title.desc=Each dashboard has its own URL slug, so this page can be bookmarked or linked from anywhere in your application.
appjars.dataquery.demo.tour.dashboard.grid.title=The stored layout
appjars.dataquery.demo.tour.dashboard.grid.desc=Widgets render in the exact layout saved in the editor; here dragging and resizing are disabled.
appjars.dataquery.demo.tour.dashboard.widget.title=Query widgets
appjars.dataquery.demo.tour.dashboard.widget.desc=Each widget executes a stored query and renders it as a chart or a table, with fixed parameter values or value generators.
appjars.dataquery.demo.tour.dashboard.finish.title=That''s it!
appjars.dataquery.demo.tour.dashboard.finish.desc=In free mode the system holds 1 dashboard. Open the Dashboards list to edit this one; widgets are added, dragged and resized in the editor.

