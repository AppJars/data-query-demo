# Home landing page
appjars.dataquery.demo.home.title=Demo de Data Query
appjars.dataquery.demo.home.hero.title=Data Query
appjars.dataquery.demo.home.hero.tagline=Reportes listos para usar en aplicaciones Vaadin y Spring Boot: consultas almacenadas sobre SQL, HQL o APIs REST, ejecutadas en vistas autogeneradas con gráficos, drill-down, reportes PDF y tableros. Esta demo te deja probar cada función antes de sumar el AppJar a tu proyecto.
appjars.dataquery.demo.home.features.title=Qué incluye
appjars.dataquery.demo.home.features.querycatalog.title=Catálogo de consultas
appjars.dataquery.demo.home.features.querycatalog.desc=Guardá consultas con parámetros tipados, columnas de resultado y categorías, y administralas desde una vista con búsqueda.
appjars.dataquery.demo.home.features.connectors.title=Tres conectores
appjars.dataquery.demo.home.features.connectors.desc=Ejecutá consultas contra tu base de datos con SQL o HQL, o contra servicios externos con el conector de API REST, y sumá los tuyos mediante la SPI de conectores.
appjars.dataquery.demo.home.features.charts.title=Gráficos
appjars.dataquery.demo.home.features.charts.desc=Visualizá los resultados como gráficos de barras, líneas, área, torta, donut o dispersión, con un botón para volver a la grilla de datos.
appjars.dataquery.demo.home.features.drilldown.title=Navegación drill-down
appjars.dataquery.demo.home.features.drilldown.desc=Los puntos de los gráficos y las columnas con enlaces son clicables: llevan los valores seleccionados a otra consulta o a una URL externa.
appjars.dataquery.demo.home.features.chaining.title=Encadenamiento de consultas
appjars.dataquery.demo.home.features.chaining.desc=Encadená consultas mediante tablas temporales con dependencias, mapeos de parámetros y generadores de valores, ideal para preparar datos externos.
appjars.dataquery.demo.home.features.reports.title=Reportes y exportación
appjars.dataquery.demo.home.features.reports.desc=Diseñá reportes PDF a medida en el diseñador WYSIWYG, o exportá cualquier grilla de resultados a CSV, XLSX o PDF.
appjars.dataquery.demo.home.features.dashboards.title=Tableros
appjars.dataquery.demo.home.features.dashboards.desc=Acomodá widgets de consultas arrastrando y redimensionando, y compartí el resultado como un tablero de solo lectura con su propia URL.
appjars.dataquery.demo.home.features.i18n.title=Textos internacionalizados
appjars.dataquery.demo.home.features.i18n.desc=Los textos de consultas, categorías y tableros pueden guardarse como claves de traducción, así el mismo contenido se muestra en el idioma de cada usuario.
appjars.dataquery.demo.home.tryit.title=Probalo ahora
appjars.dataquery.demo.home.tryit.intro=No hace falta iniciar sesión. La base de la demo viene cargada con datos de ventas de ejemplo, cinco consultas sobre tres conectores, gráficos con enlaces drill-down, un reporte PDF diseñado y un tablero. Entrá directo:
appjars.dataquery.demo.home.tryit.queries=Definiciones de consultas
appjars.dataquery.demo.home.tryit.report=Reporte Ventas por región
appjars.dataquery.demo.home.tryit.dashboard=Tablero Resumen de ventas
appjars.dataquery.demo.home.tour.button=Visita guiada
appjars.dataquery.demo.home.tour.queries=Vista Definiciones de consultas
appjars.dataquery.demo.home.tour.queryform=Editor de definiciones de consultas
appjars.dataquery.demo.home.tour.categories=Vista Categorías de consultas
appjars.dataquery.demo.home.tour.report=Vista de reporte
appjars.dataquery.demo.home.tour.designer=Vista Diseñador de reportes
appjars.dataquery.demo.home.tour.dashboards=Vista Tableros
appjars.dataquery.demo.home.tour.dashboardform=Editor de tableros
appjars.dataquery.demo.home.tour.dashboard=Vista de tablero
appjars.dataquery.demo.home.license.title=Licencia gratuita vs. completa
appjars.dataquery.demo.home.license.desc=Esta demo corre en modo gratuito: todas las funciones están completas, con un límite de 5 consultas que un usuario puede abrir y 1 tablero. Las consultas que guardan sus resultados en una tabla temporal no cuentan para el límite. Una licencia completa elimina los límites; nada más cambia.
appjars.dataquery.demo.home.license.link=Conseguí una licencia en appjars.com
appjars.dataquery.demo.home.links.title=Para saber más
appjars.dataquery.demo.home.links.github=AppJars en GitHub
appjars.dataquery.demo.home.links.readme=Documentación de Data Query

# Guided tours
appjars.dataquery.demo.tour.btn.next=Siguiente
appjars.dataquery.demo.tour.btn.back=Atrás
appjars.dataquery.demo.tour.btn.done=Listo
appjars.dataquery.demo.tour.queries.intro.title=Vista Definiciones de consultas
appjars.dataquery.demo.tour.queries.intro.desc=Un recorrido corto por el catálogo de consultas, donde se administran las consultas almacenadas. Usá Siguiente para avanzar. Podés reabrirlo desde el menú Visita guiada.
appjars.dataquery.demo.tour.queries.grid.title=El catálogo de consultas
appjars.dataquery.demo.tour.queries.grid.desc=Cada consulta almacenada con su clave, nombre, categoría, tipo de conector y estado. El menú de cada fila ofrece Ejecutar, Diseñar reporte, Editar, Habilitar/Deshabilitar y Eliminar.
appjars.dataquery.demo.tour.queries.filters.title=Filtros
appjars.dataquery.demo.tour.queries.filters.desc=Filtrá el catálogo por clave, nombre, categoría, tipo de conector o estado. En pantallas chicas los filtros pasan a un diálogo.
appjars.dataquery.demo.tour.queries.create.title=Crear consultas
appjars.dataquery.demo.tour.queries.create.desc=Abre el editor de consultas: seis pestañas que cubren el cuerpo de la consulta (SQL, HQL o REST), los parámetros, las columnas de resultado, las dependencias, la visualización con gráficos y el reporte PDF.
appjars.dataquery.demo.tour.queries.limits.title=Límites del modo gratuito
appjars.dataquery.demo.tour.queries.limits.desc=Estas insignias siguen la cuota del modo gratuito: hasta 5 consultas que un usuario puede abrir y 1 tablero. Una licencia completa elimina los límites.
appjars.dataquery.demo.tour.queries.finish.title=¡Eso es todo!
appjars.dataquery.demo.tour.queries.finish.desc=Consejo: editá la consulta Ventas por región para ver cómo están configurados su gráfico y su drill-down, o ejecutala directo desde el menú de la fila.
appjars.dataquery.demo.tour.queryform.intro.title=Editor de definiciones de consultas
appjars.dataquery.demo.tour.queryform.intro.desc=Creá una consulta almacenada y configurá cómo ejecuta y muestra sus resultados.
appjars.dataquery.demo.tour.queryform.tabs.title=Secciones de la definición
appjars.dataquery.demo.tour.queryform.tabs.desc=Las pestañas cubren opciones generales, parámetros, columnas de resultado, dependencias, visualización y diseño de reporte.
appjars.dataquery.demo.tour.queryform.connector.title=Tipo de conector
appjars.dataquery.demo.tour.queryform.connector.desc=Elegí SQL, HQL o API REST. El editor se adapta al conector seleccionado.
appjars.dataquery.demo.tour.queryform.save.title=Guardar la consulta
appjars.dataquery.demo.tour.queryform.save.desc=Guardá la definición después de configurar los campos y las columnas de resultado obligatorios.
appjars.dataquery.demo.tour.queryform.finish.title=¡Eso es todo!
appjars.dataquery.demo.tour.queryform.finish.desc=Abrí las definiciones precargadas para comparar ejemplos completos de SQL, HQL y API REST.
appjars.dataquery.demo.tour.categories.intro.title=Vista Categorías de consultas
appjars.dataquery.demo.tour.categories.intro.desc=Las categorías organizan las consultas almacenadas y controlan cómo se agrupan para los usuarios.
appjars.dataquery.demo.tour.categories.grid.title=Catálogo de categorías
appjars.dataquery.demo.tour.categories.grid.desc=Buscá categorías por clave o nombre y usá el menú de cada fila para editar o eliminar.
appjars.dataquery.demo.tour.categories.create.title=Nueva categoría
appjars.dataquery.demo.tour.categories.create.desc=Creá una categoría con nombre, descripción, icono y orden de visualización.
appjars.dataquery.demo.tour.categories.finish.title=¡Eso es todo!
appjars.dataquery.demo.tour.categories.finish.desc=Ventas, Recursos Humanos y Operaciones cubren las consultas precargadas.
appjars.dataquery.demo.tour.report.intro.title=Vista de reporte
appjars.dataquery.demo.tour.report.intro.desc=Un recorrido corto por la vista de ejecución autogenerada, sobre la consulta Ventas por región. Usá Siguiente para avanzar. Podés reabrirlo desde el menú Visita guiada.
appjars.dataquery.demo.tour.report.parameters.title=Parámetros
appjars.dataquery.demo.tour.report.parameters.desc=Este formulario se genera a partir de las definiciones de parámetros de la consulta, incluidos tipos, valores por omisión y generadores. Acá la fecha final viene precargada por un generador.
appjars.dataquery.demo.tour.report.execute.title=Ejecutar
appjars.dataquery.demo.tour.report.execute.desc=Ejecuta la consulta con los parámetros de arriba. Los resultados se cargan de a poco, con ordenamiento en el servidor y filtros por columna.
appjars.dataquery.demo.tour.report.results.title=Gráfico o grilla
appjars.dataquery.demo.tour.report.results.desc=Ventas por región se muestra como gráfico de barras; el botón de alternancia cambia a la grilla de datos, desde donde los resultados se exportan a CSV, XLSX o PDF.
appjars.dataquery.demo.tour.report.drilldown.title=Drill-down
appjars.dataquery.demo.tour.report.drilldown.desc=Después de ejecutar, hacé clic en una barra del gráfico: la región pasa a la consulta Detalle de pedidos por región, que se abre con sus parámetros precargados.
appjars.dataquery.demo.tour.report.finish.title=¡Eso es todo!
appjars.dataquery.demo.tour.report.finish.desc=Consejo: cada consulta habilitada obtiene una vista como esta. El formulario, la grilla, el gráfico y las exportaciones se generan desde la definición.
appjars.dataquery.demo.tour.designer.intro.title=Vista Diseñador de reportes
appjars.dataquery.demo.tour.designer.intro.desc=Diseñá el PDF que exporta la consulta Ventas por región.
appjars.dataquery.demo.tour.designer.canvas.title=Lienzo del reporte
appjars.dataquery.demo.tour.designer.canvas.desc=Organizá campos, etiquetas, grupos y secciones de página en el lienzo visual.
appjars.dataquery.demo.tour.designer.save.title=Guardar el reporte
appjars.dataquery.demo.tour.designer.save.desc=Validá y guardá el diseño para que las exportaciones usen la plantilla.
appjars.dataquery.demo.tour.designer.finish.title=¡Eso es todo!
appjars.dataquery.demo.tour.designer.finish.desc=Ejecutá Ventas por región y exportá PDF para ver el diseño con resultados reales.
appjars.dataquery.demo.tour.dashboards.intro.title=Vista Tableros
appjars.dataquery.demo.tour.dashboards.intro.desc=Administrá definiciones de tableros y abrí sus vistas de solo lectura.
appjars.dataquery.demo.tour.dashboards.grid.title=Catálogo de tableros
appjars.dataquery.demo.tour.dashboards.grid.desc=Buscá tableros y usá el menú de cada fila para abrir, editar, habilitar, deshabilitar o eliminar.
appjars.dataquery.demo.tour.dashboards.create.title=Nuevo tablero
appjars.dataquery.demo.tour.dashboards.create.desc=Creá un tablero y organizá widgets de consultas en su grilla.
appjars.dataquery.demo.tour.dashboards.finish.title=¡Eso es todo!
appjars.dataquery.demo.tour.dashboards.finish.desc=Abrí Resumen de ventas para ver widgets de gráficos y tablas juntos.
appjars.dataquery.demo.tour.dashboardform.intro.title=Editor de tableros
appjars.dataquery.demo.tour.dashboardform.intro.desc=Definí un tablero y organizá las consultas que presenta como widgets.
appjars.dataquery.demo.tour.dashboardform.details.title=Detalles del tablero
appjars.dataquery.demo.tour.dashboardform.details.desc=Definí la clave, el título, el slug de la URL, la descripción y el tamaño de grilla.
appjars.dataquery.demo.tour.dashboardform.widgets.title=Agregar widgets
appjars.dataquery.demo.tour.dashboardform.widgets.desc=Elegí una consulta almacenada, el modo de visualización y los parámetros de cada widget.
appjars.dataquery.demo.tour.dashboardform.layout.title=Disposición del tablero
appjars.dataquery.demo.tour.dashboardform.layout.desc=Arrastrá y redimensioná widgets en la grilla para crear la disposición guardada.
appjars.dataquery.demo.tour.dashboardform.save.title=Guardar el tablero
appjars.dataquery.demo.tour.dashboardform.save.desc=Guardá la definición antes de abrir su URL de solo lectura.
appjars.dataquery.demo.tour.dashboardform.finish.title=¡Eso es todo!
appjars.dataquery.demo.tour.dashboardform.finish.desc=La licencia gratuita incluye un tablero, representado por Resumen de ventas en esta demo.
appjars.dataquery.demo.tour.dashboard.intro.title=Vista de tablero
appjars.dataquery.demo.tour.dashboard.intro.desc=Un recorrido corto por el tablero en ejecución, sobre el tablero Resumen de ventas. Usá Siguiente para avanzar. Podés reabrirlo desde el menú Visita guiada.
appjars.dataquery.demo.tour.dashboard.title.title=Una página para compartir
appjars.dataquery.demo.tour.dashboard.title.desc=Cada tablero tiene su propio slug en la URL, así que esta página se puede guardar como favorito o enlazar desde cualquier parte de tu aplicación.
appjars.dataquery.demo.tour.dashboard.grid.title=La disposición guardada
appjars.dataquery.demo.tour.dashboard.grid.desc=Los widgets se muestran con la disposición exacta guardada en el editor; acá arrastrar y redimensionar están deshabilitados.
appjars.dataquery.demo.tour.dashboard.widget.title=Widgets de consultas
appjars.dataquery.demo.tour.dashboard.widget.desc=Cada widget ejecuta una consulta almacenada y la muestra como gráfico o tabla, con valores de parámetros fijos o generadores de valores.
appjars.dataquery.demo.tour.dashboard.finish.title=¡Eso es todo!
appjars.dataquery.demo.tour.dashboard.finish.desc=En modo gratuito el sistema admite 1 tablero. Abrí la lista de Tableros para editarlo; los widgets se agregan, arrastran y redimensionan en el editor.

